<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche de livres - Suivi de lectures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu-placeholder"></div>

  <main class="container">
    <h1>Rechercher un livre</h1>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Tape un titre, un auteur ou un ISBN..." required autofocus>
      <button type="submit" id="search-btn">Rechercher</button>
    </form>
    <div id="result">
      <p class="search-hint">💡 Tapez le titre d'un livre ou le nom d'un auteur pour lancer la recherche.</p>
    </div>
  </main>

  <!-- Popup 1 : Informations détaillées du livre -->
  <div id="info-popup" class="popup" style="display:none;">
    <div class="popup-content">
      <span class="close-button" id="info-close">&times;</span>
      
      <div class="edit-header-details">
        <img id="info-cover" class="popup-cover" src="" alt="Couverture">
        <div class="edit-meta">
          <h2 id="info-title" style="margin-top: 0; text-align: left;"></h2>
          <p id="info-authors" style="font-weight: bold; color: #666; margin-top: -5px;"></p>
          <p><strong>Genre :</strong> <span id="info-genre"></span></p>
          <p><strong>Date de parution :</strong> <span id="info-date"></span></p>
        </div>
      </div>

      <div class="edit-block" style="margin-top: 15px;">
        <label>Résumé :</label>
        <div id="info-description" class="edit-description" style="max-height: 220px;"></div>
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
        <button id="info-cancel" class="btn-secondary">Fermer</button>
        <button id="info-add-btn">Ajouter à ma bibliothèque</button>
      </div>
    </div>
  </div>

  <!-- Popup 2 : Choix du statut et champs conditionnels -->
  <div id="add-popup" class="popup" style="display:none;">
    <div class="popup-content popup-compact">
      <span class="close-button" id="add-close">&times;</span>
      <h3 style="margin-top: 0;">Ajouter à ma bibliothèque</h3>
      <p id="add-book-title" style="font-weight: bold; margin-bottom: 15px; color: #555;"></p>

      <label for="add-status">Statut de lecture :</label>
      <select id="add-status">
        <option value="À lire">À lire</option>
        <option value="En cours">En cours</option>
        <option value="Terminé">Terminé</option>
        <option value="Abandonné">Abandonné</option>
      </select>

      <div id="field-start" style="display: none; margin-top: 12px;">
        <label for="add-start">Date de début :</label>
        <input type="date" id="add-start">
      </div>

      <div id="field-end" style="display: none; margin-top: 12px;">
        <label for="add-end">Date de fin :</label>
        <input type="date" id="add-end">
      </div>

      <div id="field-note" style="display: none; margin-top: 12px;">
        <label for="add-note">Note (sur 5) :</label>
        <input type="number" id="add-note" min="1" max="5" step="1" placeholder="Note de 1 à 5">
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
        <button id="add-cancel" class="btn-secondary">Annuler</button>
        <button id="add-save">Valider l'ajout</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
