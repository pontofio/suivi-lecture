<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma PAL - Suivi de lectures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu-placeholder"></div>

  <main class="container">
    <h1>Pile à Lire (PAL)</h1>

    <section id="roulette-section">
      <h2>Tirer ma prochaine lecture</h2>
      <div id="roulette-container">
        <div id="fleche-roue">▼</div>
        <canvas id="wheel-canvas" width="320" height="320"></canvas>
      </div>
      <button id="spin-btn">Tourner la roue</button>
      <div id="pal-selection-message"></div>
    </section>

    <section>
      <h2>Mes livres à lire (<span id="pal-count">0</span>)</h2>
      <div id="pal-library" class="grid-container"></div>
    </section>
  </main>

  <div id="confirm-pal-modal" class="popup" style="display: none;">
    <div class="popup-content popup-compact text-center">
      <h3>🎉 Livre tiré au sort !</h3>
      <p id="modal-livre-titre" class="modal-highlight"></p>
      <p>Voulez-vous passer ce livre au statut <strong>"En cours"</strong> dès aujourd'hui ?</p>
      <div class="modal-actions">
        <button id="btn-valider-lecture">Valider la lecture</button>
        <button id="btn-annuler-lecture" class="btn-secondary">Garder dans la PAL</button>
      </div>
    </div>
  </div>

  <div id="edit-popup" class="popup" style="display:none;">
    <div class="popup-content">
      <span class="close-button" id="edit-close">&times;</span>
      <h2>Modifier le livre</h2>
      
      <div class="edit-header-details">
        <img id="edit-cover-preview" class="popup-cover" src="" alt="Couverture">
        <div class="edit-block edit-meta">
          <h3 id="edit-title" class="edit-title"></h3>
          <p id="edit-authors" class="edit-authors"></p>
          <p><strong>Genre :</strong> <span id="edit-genre-text" class="edit-genre-text"></span></p>
        </div>
      </div>

      <div class="edit-block">
        <label>Résumé :</label>
        <div id="edit-desc-text" class="edit-description"></div>
      </div>

      <div class="edit-line">
        <div class="edit-field">
          <label for="edit-status">Statut :</label>
          <select id="edit-status">
            <option value="À lire">À lire</option>
            <option value="En cours">En cours</option>
            <option value="Terminé">Terminé</option>
            <option value="Abandonné">Abandonné</option>
          </select>
        </div>
        <div class="edit-field">
          <label for="edit-note">Note (sur 5) :</label>
          <input type="number" id="edit-note" min="1" max="5" step="1" placeholder="Note de 1 à 5">
        </div>
      </div>

      <div class="edit-line">
        <div class="edit-field">
          <label for="edit-start">Date de début :</label>
          <input type="date" id="edit-start">
        </div>
        <div class="edit-field">
          <label for="edit-end">Date de fin :</label>
          <input type="date" id="edit-end">
        </div>
      </div>

      <div class="edit-line">
        <div class="edit-field">
          <label for="edit-saga">Saga associée :</label>
          <select id="edit-saga">
            <option value="">-- Aucune saga --</option>
            <option value="__NEW__">➕ Créer une nouvelle saga...</option>
          </select>
        </div>

        <div class="edit-field" id="edit-field-saga-tome" style="display: none;">
          <label for="edit-saga-tome">Numéro de tome :</label>
          <input type="number" id="edit-saga-tome" min="1" placeholder="Ex: 1, 2, 3...">
        </div>
      </div>

      <div class="edit-field" id="edit-field-new-saga" style="display: none; margin-bottom: 12px;">
        <label for="edit-new-saga-title">Nom de la nouvelle saga :</label>
        <input type="text" id="edit-new-saga-title" placeholder="Ex: Harry Potter, Dune...">
      </div>

      <div class="edit-buttons">
        <button id="edit-delete" class="delete-button" style="margin-right: auto;">Supprimer ce livre</button>
        <button id="edit-cancel" class="btn-secondary">Annuler</button>
        <button id="edit-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
